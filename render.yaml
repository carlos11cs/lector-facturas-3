services:
  - type: web
    name: lector-facturas
    env: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_INVOICE_MODEL
        value: "gpt-5.6-sol"
      - key: OPENAI_INVOICE_MAX_OUTPUT_TOKENS
        value: "32768"
      - key: OPENAI_INVOICE_TIMEOUT_SECONDS
        value: "240"
      - key: OPENAI_INVOICE_REASONING_EFFORT
        value: "low"
      - key: OPENAI_INVOICE_AUDIT_REASONING_EFFORT
        value: "high"
      - key: DATABASE_URL
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_ENDPOINT_URL
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_PUBLIC_BASE_URL
        sync: false
      - key: ANALYSIS_TIMEOUT_SECONDS
        value: "600"
      - key: GUNICORN_TIMEOUT_SECONDS
        value: "660"
      - key: EASYOCR_MODEL_STORAGE_DIRECTORY
        value: "/opt/easyocr-models"
      - key: ACCESS_FROM_EMAIL
        sync: false
      - key: REPORTS_FROM_EMAIL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_ADVANCED
        sync: false
      - key: STRIPE_PRICE_STARTER_ANNUAL
        sync: false
      - key: STRIPE_PRICE_PRO_ANNUAL
        sync: false
      - key: STRIPE_PRICE_ADVANCED_ANNUAL
        sync: false
      - key: STRIPE_PROMO_COUPON_3M_50
        sync: false
